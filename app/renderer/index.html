      <div class="eyebrow"><span></span> UN PETIT PEU DE DOUCEUR</div>
      <h1>Fais une place<br>à <span>Pip.</span></h1>
      <p>Un petit hamster, une grande compagnie.<br>Il explore ton bureau et fond sous les caresses.</p>
      <div class="demo-tip"><span>♡</span> Passe ta souris sur lui pour le caresser.</div>
      <div class="demo-controls" aria-label="Essayer les animations">
        <button type="button" data-mode="idle">Au calme</button>
        <button type="button" data-mode="walk">Balade</button>
        <button type="button" data-mode="sleep">Dodo</button>
        <button type="button" id="demo-feed">Une graine</button>
      </div>

<legend>Ton petit compagnon</legend>

<button id="demo-reset-look" type="button">Retrouver mon compagnon au naturel</button>
